name: Deploy Veteriner Akademi to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html style.css script.js _site/
          if [ -d css ]; then cp -R css _site/; fi
          if [ -d js ]; then cp -R js _site/; fi
          if [ -d assets ]; then cp -R assets _site/; fi
          if [ -d images ]; then cp -R images _site/; fi
          if [ -f README.md ]; then cp README.md _site/; fi
          if [ -d supabase ]; then cp -R supabase _site/; fi
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
